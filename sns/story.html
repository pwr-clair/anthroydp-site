<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Closing Party Story</title>
<style>
@font-face{font-family:"Noto Sans KR";src:url(FONT_DIR/NotoSansKR-VF.otf) format("opentype");font-weight:100 900}
@font-face{font-family:"Archivo Black";src:url(FONT_DIR/ArchivoBlack.woff2) format("woff2");font-weight:400}
</style>
<style>
:root{--blue:#1e5cff;--ink:#fff;--bg:#06091a}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:"Noto Sans KR",sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:url(BG_SRC) center/cover no-repeat}
.px{position:absolute;border:4px solid #fff;image-rendering:pixelated}
.dot{position:absolute;border:4px dotted #fff;border-radius:50%}
.stage{position:absolute;inset:0;padding:180px 72px 200px}
.tag{display:inline-block;font-weight:900;font-size:40px;letter-spacing:.02em;padding:6px 0 10px;border-bottom:5px dotted #fff}
.small{margin-top:64px;font-weight:700;font-size:34px;line-height:1.35;color:#dfe6ff}
.small b{color:#fff;font-weight:900}
.closing{text-shadow:0 0 18px rgba(5,8,20,.9);margin-top:10px;font-family:"Archivo Black",sans-serif;font-size:118px;line-height:.95;letter-spacing:-.01em;color:#fff;text-shadow:0 0 0 #000}
.closing span{display:block}
.title{text-shadow:0 0 18px rgba(5,8,20,.95),0 0 40px rgba(5,8,20,.8);margin-top:64px;font-weight:900;font-size:128px;line-height:1.04;letter-spacing:-.02em}
.title .l{display:inline-block;padding-bottom:6px;border-bottom:6px dotted #fff}
.title .dc{color:var(--blue);-webkit-text-stroke:3px #fff;color:#fff}
.title .ang{font-weight:500;color:#9fb6ff;margin:0 4px}
.sub{margin-top:36px;font-weight:700;font-size:38px;color:#dfe6ff;letter-spacing:.02em}
.when{position:absolute;left:72px;bottom:300px;font-family:"Archivo Black","Noto Sans KR",sans-serif;font-size:74px;line-height:1.1;letter-spacing:-.01em}
.when small{font-family:"Noto Sans KR";font-weight:900;font-size:60px}
.where{position:absolute;left:72px;bottom:210px;font-weight:700;font-size:38px;line-height:1.4;color:#dfe6ff}
.where b{font-weight:900;color:#fff}
.chip{position:absolute;right:72px;bottom:212px;width:150px;height:150px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;line-height:1.1;text-align:center;letter-spacing:-.02em}
</style></head><body>
<div class="bg"></div>
<div class="px" style="left:520px;top:190px;width:200px;height:60px"></div>
<div class="dot" style="right:80px;top:170px;width:120px;height:120px"></div>
<div class="px" style="right:90px;top:560px;width:240px;height:240px;border-color:#fff;clip-path:polygon(0 30%,35% 30%,35% 0,70% 0,70% 30%,100% 30%,100% 100%,0 100%)"></div>
<div class="px" style="left:760px;bottom:620px;width:150px;height:200px"></div>
<div class="stage">
  <div class="tag">2026 예술기술도시</div>
  <div class="small"><b>&lt;&lt;인류학 연습: 인간은 우리인가?&gt;&gt;</b></div>
  <div class="closing"><span>Closing</span><span>Party</span></div>
  <div class="title"><span class="ang">&lt;</span><span class="l dc">D.C :</span><br><span class="l">맨 처음으로</span><br><span class="l">다시</span><span class="ang">&gt;</span></div>
</div>
<div class="when">2026.9.20. <small>일.</small> 7PM</div>
<div class="where">영등포구 경인로727<br><b>종도빌딩 1층</b></div>
<div class="chip">문화도시<br>영등포</div>
</body></html>
